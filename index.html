<!DOCTYPE html>
<html lang="en" dir="ltr" data-ui-dir="ltr" class="light m-0 h-svh w-full p-0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="connect-src 'self'; frame-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>Pix AI — Gemini Assistant</title>
<meta name="description" content="Pix AI — واجهة ذكاء اصطناعي تعمل بمحرك Gemini.">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/local.css">
<script>
/* Apply saved theme before first paint (no flash). */
(function(){try{var t=localStorage.getItem('pix-ai-theme');if(!t){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light'}
var d=document.documentElement;d.classList.toggle('dark',t==='dark');d.classList.toggle('light',t!=='dark');
var raw=localStorage.getItem('pix-ai-v1');var lang=raw?(JSON.parse(raw).lang||'en'):((navigator.language||'').indexOf('ar')===0?'ar':'en');
d.lang=lang;d.dir=lang==='ar'?'rtl':'ltr';d.setAttribute('data-ui-dir',d.dir)}catch(e){}})();
</script>
</head>
<body class="font-sans EW4Iya_variable J_uD0a_variable yldcfq_variable lUkF5W_variable tfF-4G_variable Eyl7uW_variable cSUtNa_variable text-text-primary bg-surface-primary antialiased">

<div class="ao-app" id="app">
  <div class="ao-scrim" id="scrim"></div>

  <aside class="ao-side" id="side">
    <div class="ao-side-head">
      <div class="ao-brand"><img src="assets/img/favicon.svg" alt=""><span>Pix</span></div>
      <button class="ao-iconbtn" id="collapseBtn" type="button" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg>
      </button>
    </div>
    <nav class="ao-nav">
      <button class="ao-navbtn" id="newChat" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span id="newChatTxt">New chat</span>
      </button>
    </nav>
    <div class="ao-sec" id="recentLbl">Recent</div>
    <div class="ao-hist" id="hist"></div>
    <div class="ao-side-foot">
      <div class="ao-foot-row">
        <button class="ao-pill" id="themeBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <span id="themeTxt">Theme</span>
        </button>
        <button class="ao-pill" id="langBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          <span id="langTxt">العربية</span>
        </button>
      </div>
      <div class="ao-note" id="offlineNote">Connected to Gemini through Pix API.</div>
    </div>
  </aside>

  <main class="ao-main">
    <header class="ao-top">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button class="ao-iconbtn" id="menuBtn" type="button" aria-label="Menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <div class="ao-seg" role="group" aria-label="Mode">
          <button type="button" id="mSide" aria-pressed="true">Side by side</button>
          <button type="button" id="mBattle" aria-pressed="false">Battle</button>
          <button type="button" id="mDirect" aria-pressed="false">Direct</button>
        </div>
      </div>
      <span class="ao-badge" id="badge">Gemini AI</span>
    </header>

    <div class="ao-scroll" id="scroll">
      <section class="ao-landing" id="landing">
        <h1 id="h1">Compare search models</h1>
        <p class="sub" id="sub">Send one prompt to two search models and pick the better answer.</p>
        <div id="landingSlot">
          <div class="ao-composer" id="composer">
            <div id="sendWrap">
              <textarea id="prompt" rows="1" dir="auto" enterkeyhint="send" autocomplete="off" spellcheck="true" placeholder="Ask anything…"></textarea>
              <div class="ao-crow">
                <div class="ao-models">
                  <select class="ao-sel" id="selA"></select>
                  <select class="ao-sel" id="selB"></select>
                  <select class="ao-sel ao-hidden" id="selS"></select>
                </div>
                <button class="ao-send" id="send" type="button" disabled aria-label="Send">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>
        <div class="ao-chips" id="chips"></div>
      </section>

      <section class="ao-conv ao-hidden" id="conv" aria-live="polite"></section>
    </div>

    <div class="ao-dock ao-hidden" id="dock"><div id="dockSlot"></div></div>
  </main>
</div>

<div class="ao-toast" id="toast" role="status"></div>
<script src="assets/js/app.js"></script>
</body>
</html>
